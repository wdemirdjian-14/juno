# Config Nginx pour le site JUNO
# Copier dans /etc/nginx/sites-available/juno puis activer (voir README.md)
server {
    listen 80;
    listen [::]:80;
    server_name VOTRE-DOMAINE.fr www.VOTRE-DOMAINE.fr;

    root /var/www/juno;
    index index.html;

    # Ne jamais servir les fichiers internes du dépôt
    location ~ /\.(git|ht) { deny all; }
    location ^~ /deploy/ { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(jpg|jpeg|png|svg|webp|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
