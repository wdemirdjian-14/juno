# Back-office JUNO — inclus dans le bloc server du site par install-backoffice.sh
# (copié dans /etc/nginx/snippets/juno-backoffice.conf)

# La page d'accueil est générée par le back-office (textes modifiés)
location = / {
    root /var/lib/juno/public;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
}
location = /index.html {
    root /var/lib/juno/public;
    add_header Cache-Control "no-cache";
}

# Formulaire, mesure d'audience et API du back-office
location ^~ /api/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 600k;
}

# Interface du back-office
location ^~ /admin {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Code du serveur : jamais servi
location ^~ /server/ { deny all; }
